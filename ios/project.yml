name: LockYour
options:
  bundleIdPrefix: www.coreader.studio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: V6MKVNS45G
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    APP_ATTEST_ENVIRONMENT: development
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
configs:
  Debug: debug
  Release: release
schemes:
  LockYour:
    build:
      targets:
        LockYour: all
    test:
      targets:
        - LockYourTests
targets:
  LockYour:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lock Phone
        CFBundleName: LockPhone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Lock Phone
            CFBundleURLSchemes: [lockphone]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        API_BASE_URL: $(API_BASE_URL)
    entitlements:
      path: App/LockYour.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.www.coreader.studio.lockyour
        com.apple.developer.devicecheck.appattest-environment: $(APP_ATTEST_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: www.coreader.studio.lockyour
        PRODUCT_NAME: LockYour
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        API_BASE_URL: http://localhost:8080
      configs:
        Release:
          API_BASE_URL: https://lock-api-production.up.railway.app
          APP_ATTEST_ENVIRONMENT: production
    dependencies:
      - target: LockYourMonitor
        embed: true
      - target: LockYourShieldConfiguration
        embed: true
      - target: LockYourLiveActivity
        embed: true
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: ActivityKit.framework
      - sdk: DeviceCheck.framework
      - sdk: Security.framework
  LockYourMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: MonitorExtension
      - path: Shared
        excludes:
          - Copy.swift
          - LockActivityAttributes.swift
    info:
      path: MonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: Lock Phone Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockYourMonitorExtension
    entitlements:
      path: MonitorExtension/LockYourMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.www.coreader.studio.lockyour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: www.coreader.studio.lockyour.monitor
        PRODUCT_NAME: LockYourMonitor
        SKIP_INSTALL: YES
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
  LockYourShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfigurationExtension
      - path: Shared
        excludes:
          - LockActivityAttributes.swift
          - LockYourConstants.swift
          - SharedLockState.swift
          - SharedWhitelistStore.swift
    info:
      path: ShieldConfigurationExtension/Info.plist
      properties:
        CFBundleDisplayName: Lock Phone Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockYourShieldConfiguration
    entitlements:
      path: ShieldConfigurationExtension/LockYourShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.www.coreader.studio.lockyour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: www.coreader.studio.lockyour.shieldconfiguration
        PRODUCT_NAME: LockYourShieldConfiguration
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
  LockYourLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivityExtension
      - path: Shared
        excludes:
          - LockYourConstants.swift
          - SharedLockState.swift
          - SharedWhitelistStore.swift
    info:
      path: LiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: Lock Phone Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    entitlements:
      path: LiveActivityExtension/LockYourLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.www.coreader.studio.lockyour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: www.coreader.studio.lockyour.liveactivity
        PRODUCT_NAME: LockYourLiveActivity
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
  LockYourTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LockYour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: www.coreader.studio.lockyour.tests
        GENERATE_INFOPLIST_FILE: YES
